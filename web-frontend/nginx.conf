server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 10.96.0.10 valid=10s ipv6=off;
    set $suggestion_service suggestion-service.search-autocomplete.svc.cluster.local:8080;
    set $analytics_service query-analytics-service.search-autocomplete.svc.cluster.local:8080;

    location = /api/v1/suggestions {
        proxy_pass http://$suggestion_service/api/v1/suggestions$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /api/v1/query-events {
        proxy_pass http://$analytics_service/api/v1/query-events;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
